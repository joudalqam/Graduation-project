<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Trip Planner — Customize Each Day</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <!-- ============ NAVBAR (injected by layout.js) ============ -->
  <div id="navbar-placeholder"></div>

  <div class="customize-page">
    <!-- ============ HERO ============ -->
    <div class="page-hero">
      <img src="daedsea.jpg" alt="Travel destination" />
      <div class="page-hero-overlay"></div>
      <div class="page-hero-content">
        <span class="script">Customize</span>
        <span class="display">EACH DAY</span>
        <div class="hero-pills" id="heroPills">
          <!-- Filled by JS -->
        </div>
      </div>
    </div>

    <!-- ============ DAY CARDS ============ -->
    <div class="days-content" id="daysContainer">
      <!-- Filled by JS -->
    </div>

    <!-- Generate Button -->
    <div class="generate-btn-wrap">
      <button class="btn-generate" id="generateBtn" onclick="handleGenerate()" style="max-width: 400px; margin: 0 auto;">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/><path d="M19 3v4"/><path d="M21 5h-4"/></svg>
        Generate My Trip Plan
      </button>
    </div>
  </div>

  <!-- ============ FOOTER (injected by layout.js) ============ -->
  <div id="footer-placeholder"></div>

  <script src="js/layout.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/customize.js"></script>
</body>
</html>
