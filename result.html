<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Trip Planner — Your Trip Plan</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>

    <!-- ============ NAVBAR (injected by layout.js) ============ -->
    <div id="navbar-placeholder"></div>

    <div class="result-page">
      <div class="page-hero">
        <img src="mountain-hiking.jpeg" alt="Trip destination" />
        <div class="page-hero-overlay"></div>
        <div class="page-hero-content">
          <span class="script">Your</span>
          <span class="display">TRIP PLAN</span>
          <div class="hero-pills" id="heroPills">
            <!-- Filled by JS -->
          </div>
        </div>
      </div>

      <div class="result-content">
        <div class="itinerary-section" id="itinerarySection">
          <!-- Filled by JS -->
        </div>

        <div class="result-sidebar">
          <div class="sidebar-card">
            <h3>TRIP SUMMARY</h3>
            <div id="tripSummary">
              <!-- Filled by JS -->
            </div>

            <div class="action-btns">
              <button class="btn-whatsapp" onclick="sendToWhatsApp()">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12a19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 3.64 1h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z" />
                </svg>
                Send to WhatsApp
              </button>

              <button class="btn-save" onclick="saveTrip()">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z" />
                  <polyline points="17 21 17 13 7 13 7 21" />
                  <polyline points="7 3 7 8 15 8" />
                </svg>
                Save Trip
              </button>

              <button class="btn-regenerate" onclick="regenerateItinerary()">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="1 4 1 10 7 10" />
                  <path d="M3.51 15a9 9 0 1 0 .49-3.5" />
                </svg>
                Regenerate Plan
              </button>
            </div>

            <div id="saveStatus" class="form-status" hidden></div>
          </div>

          <div class="sidebar-card">
            <h3>TRIP MAP</h3>
            <div id="map" style="width: 100%; height: 400px; border-radius: 16px"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- ============ FOOTER (injected by layout.js) ============ -->
    <div id="footer-placeholder"></div>

    <script src="js/layout.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/result.js"></script>
    <script
      async
      defer
      src="https://maps.googleapis.com/maps/api/js?key=AIzaSyD7xlMkkonlvRyEl2aNfD6m2lclpd5Tq1g&callback=initMap"
    ></script>
  </body>
</html>
